<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="title desc">
  <title id="title">ACP Framework Domains</title>
  <desc id="desc">The eleven ACP control domains in six groups: Governance (1 Business and Security Governance, 2 Risk Management), Security Management (3 Security Policies and Processes, 4 Identity and Access Management), Infrastructure Protection (5 Infrastructure Security, 6 Endpoint Security, 7 Network Security), Data and Monitoring (8 Data Protection, Backup and Recovery, 9 Monitoring and Incident Response), Program Development (10 Continuous Improvement) and AI Security (11 AI Security, if applicable). Domains 1, 4, 8, 9 and 11 are critical.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
    .h { font-size: 20px; font-weight: 700; }
    .i { font-size: 16px; }
    .c { font-size: 13px; fill-opacity: 0.85; }
  </style>

  <rect x="10" y="10" width="780" height="780" rx="18" fill="#f4f6fa" stroke="#d5dce8" stroke-width="2"/>

  <rect x="20" y="20" width="760" height="76" rx="14" fill="#1f3a5f"/>
  <text x="48" y="68" style="font-size:28px;font-weight:700">ACP Framework Domains</text>
  <text x="752" y="66" text-anchor="end" style="font-size:15px" fill-opacity="0.85">Framework 1.5 · 11 domains</text>

  <rect x="44" y="116" width="712" height="96" rx="10" fill="#e0691a"/>
  <text x="68" y="146" class="h">Governance</text>
  <text x="88" y="172" class="i">1  Business &amp; Security Governance <tspan class="c">(critical)</tspan></text>
  <text x="88" y="196" class="i">2  Risk Management</text>

  <rect x="44" y="226" width="712" height="96" rx="10" fill="#4a8f36"/>
  <text x="68" y="256" class="h">Security Management</text>
  <text x="88" y="282" class="i">3  Security Policies &amp; Processes</text>
  <text x="88" y="306" class="i">4  Identity &amp; Access Management <tspan class="c">(critical)</tspan></text>

  <rect x="44" y="336" width="712" height="120" rx="10" fill="#2f6db3"/>
  <text x="68" y="366" class="h">Infrastructure Protection</text>
  <text x="88" y="392" class="i">5  Infrastructure Security</text>
  <text x="88" y="416" class="i">6  Endpoint Security</text>
  <text x="88" y="440" class="i">7  Network Security</text>

  <rect x="44" y="470" width="712" height="96" rx="10" fill="#1d4b85"/>
  <text x="68" y="500" class="h">Data &amp; Monitoring</text>
  <text x="88" y="526" class="i">8  Data Protection, Backup &amp; Recovery <tspan class="c">(critical)</tspan></text>
  <text x="88" y="550" class="i">9  Monitoring &amp; Incident Response <tspan class="c">(critical)</tspan></text>

  <rect x="44" y="580" width="712" height="72" rx="10" fill="#7349ad"/>
  <text x="68" y="610" class="h">Program Development</text>
  <text x="88" y="636" class="i">10  Continuous Improvement</text>

  <rect x="44" y="666" width="712" height="72" rx="10" fill="#0d7a7a"/>
  <text x="68" y="696" class="h">AI Security <tspan class="c">(if applicable)</tspan></text>
  <text x="88" y="722" class="i">11  AI Security <tspan class="c">(critical when applicable)</tspan></text>

  <text x="400" y="770" text-anchor="middle" style="font-size:13px;fill:#4a5568">Controls and scoring: assessment/assessment-checklist.md · assessment/scoring-model.md</text>
</svg>
